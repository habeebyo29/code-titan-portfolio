<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in | Code Titan</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/myportfolio.css') }}"><style>body{min-height:100vh;display:grid;place-items:center;padding:22px}.auth-card{width:min(100%,440px);padding:34px;border:1px solid var(--border);border-radius:22px;background:var(--bg-card);box-shadow:var(--shadow)}.auth-card h1{font:700 30px 'Space Grotesk';margin:12px 0}.auth-card p{color:var(--text-muted);margin-bottom:22px}.auth-card label{display:block;margin:13px 0 6px;font-size:13px;font-weight:700}.auth-card input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)}.auth-card button{width:100%;margin-top:20px}.auth-brand{font-weight:800;color:var(--cyan);letter-spacing:.12em}</style></head><body><main class="auth-card"><a class="auth-brand" href="{{ url_for('home') }}">CODE TITAN</a><h1>Admin sign in</h1><p>Sign in to view messages sent through your portfolio contact form.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash-message {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="email">Admin email</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="btn btn-primary" type="submit">Sign in securely</button></form><p style="margin-top:22px"><a href="{{ url_for('home') }}">← Back to portfolio</a></p></main></body></html>
